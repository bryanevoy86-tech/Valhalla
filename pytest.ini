[pytest]
addopts = -q
markers =
    unit: fast tests, no network or db
    integration: tests that hit external services or networks
testpaths = tests services/api/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore:The configuration option "asyncio_default_fixture_loop_scope" is unset:pytest.PytestDeprecationWarning
