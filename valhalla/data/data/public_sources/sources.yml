# data/public_sources/sources.yml
# Phase 1 sources: Alberta + Ontario macro
# NOTE: These are open data / official sources.

sources:
  - name: edmonton_property_assessment_current
    kind: socrata_csv
    url: "https://data.edmonton.ca/api/views/q7d6-ambg/rows.csv?accessType=DOWNLOAD"
    out: "data/public_sources/raw/edmonton_assessment_current.csv"

  - name: calgary_property_assessment_current
    kind: socrata_csv
    url: "https://data.calgary.ca/api/views/4bsw-nn7w/rows.csv?accessType=DOWNLOAD"
    out: "data/public_sources/raw/calgary_assessment_current.csv"

  - name: calgary_property_assessment_historical
    kind: socrata_csv
    url: "https://data.calgary.ca/api/views/4ur7-wsgc/rows.csv?accessType=DOWNLOAD"
    out: "data/public_sources/raw/calgary_assessment_historical.csv"

  # Ontario "free outcomes" are limited; start with macro context that is official & downloadable.
  - name: statcan_nhpi_monthly
    kind: statcan_table
    url: "https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=1810020501"
    out: "data/public_sources/raw/statcan_nhpi_monthly.csv"
    note: "Download entire table as CSV from StatCan UI if automated fetch fails."
