[alembic]
# script_location can be relative to this config file (./alembic means /app/alembic when config is at /app)
script_location = alembic
# Use DATABASE_URL environment variable on production
# Fallback URL for local development (also uses env var if set)
sqlalchemy.url = postgresql+psycopg2://

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers = console
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
